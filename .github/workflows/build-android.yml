name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/android-apk-build
      - feature/codemirror-luau-tabs
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'native/**'
      - 'scripts/**'
      - 'src/plugins/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html styles.css manifest.webmanifest sw.js www/
          npm run build

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android project already exists; reusing generated folder."
          fi

      - name: Sync web application
        run: npx cap sync android

      - name: Patch native plugins and manifest
        run: |
          node scripts/patch-native.js
          node scripts/patch-native.js
          node - <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('android/app/src/main/AndroidManifest.xml', 'utf8');
          const queries = (xml.match(/<queries>/g) || []).length;
          if (queries !== 1 || !xml.includes('android:name="com.roblox.client"') || !xml.includes('android:scheme="roblox"')) {
            console.error('[patch-native] idempotency verification failed: queries=' + queries);
            process.exit(1);
          }
          console.log('[patch-native] idempotency verified: exactly one <queries> block after two runs.');
          NODE

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delta-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
